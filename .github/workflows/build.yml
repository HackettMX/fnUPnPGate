name: Build & Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号与镜像名
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${OWNER}/fnupnpgate" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DH_USER}/fnupnpgate" >> "$GITHUB_OUTPUT"
          echo "pull_image=${DH_USER}/fnupnpgate" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像（Docker Hub + GHCR 双推）
        uses: docker/build-push-action@v6
        with:
          context: src
          push: true
          tags: |
            ${{ steps.meta.outputs.dockerhub_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.dockerhub_image }}:latest
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr_image }}:latest

      - name: 同步版本号到 manifest 与 compose
        run: |
          sed -i "s/^version=.*/version=\"${{ steps.meta.outputs.version }}\"/" fpk/manifest
          sed -i "s|image:.*|image: ${{ steps.meta.outputs.pull_image }}:${{ steps.meta.outputs.version }}|" fpk/app/docker/docker-compose.yaml

      - name: 下载 fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack

      - name: 打包 .fpk
        run: |
          chmod +x fpk/cmd/*
          cd fpk
          fnpack build
          VERSION="${{ steps.meta.outputs.version }}"
          mv fnportgate.fpk "../fnportgate-${VERSION}.fpk"
          cd ..
          ls -la fnportgate-*.fpk

      - name: 上传 .fpk 构件
        uses: actions/upload-artifact@v4
        with:
          name: fnportgate-fpk
          path: fnportgate-*.fpk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fnportgate-*.fpk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
