services:
  fnportgate:
    # 镜像仓库：Docker Hub（hackett/fnupnpgate），CI 同时推一份到 ghcr.io 作备份。
    # Docker Hub 仓库默认 Public，且飞牛内置镜像加速器对它有效，国内拉取更稳。
    # 如需换回 ghcr，改为 ghcr.io/hackettmx/fnupnpgate:1.0.0 并设包为 Public 即可。
    image: hackett/fnupnpgate:1.0.0
    container_name: fnportgate
    # UPnP 需要 SSDP 组播发现网关，且端口映射要指向本机局域网 IP，
    # 必须使用 host 网络模式，不能用桥接。
    network_mode: host
    restart: unless-stopped
    environment:
      - FN_UPNP_WEB_PORT=8090
      - FN_UPNP_DATA_DIR=/data
      - TZ=Asia/Shanghai
    volumes:
      - ${TRIM_PKGVAR}/data:/data
