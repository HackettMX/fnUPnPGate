<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>端口转发 · fnPortGate</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="26" height="26" fill="none">
            <rect x="6" y="6" width="36" height="36" rx="10" fill="url(#g1)" />
            <path d="M24 14a5 5 0 0 1 5 5v5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V26a2 2 0 0 1 2-2h3v-5a5 5 0 0 1 5-5zm0 4a1 1 0 0 0-1 1v5h2v-5a1 1 0 0 0-1-1z" fill="#fff" />
            <defs>
              <linearGradient id="g1" x1="6" y1="6" x2="42" y2="42">
                <stop stop-color="#ffb04d" /><stop offset="1" stop-color="#f56b00" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <h1>端口转发</h1>
          <p>通过 UPnP 管理路由器端口转发</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="conn-pill" class="pill pill-offline"><i class="dot"></i><span id="conn-text">未连接</span></span>
        <button id="btn-refresh" class="btn btn-ghost" title="重新发现并刷新">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="stats">
        <div class="stat-card">
          <div class="stat-icon" style="--c:#f56b00;--bg:#fff1e2"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 2a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4V6z"/></svg></div>
          <div class="stat-meta">
            <span class="stat-label">公网 IP</span>
            <span class="stat-value" id="stat-external">—</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="--c:#2f6fed;--bg:#e8f0ff"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 4h16v2H4V4zm2 4h12v2H6V8zm-2 4h16v2H4v-2zm2 4h12v2H6v-2zm-2 4h16v2H4v-2z"/></svg></div>
          <div class="stat-meta">
            <span class="stat-label">网关设备</span>
            <span class="stat-value" id="stat-gateway">—</span>
            <span class="stat-sub" id="stat-gateway-sub"></span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="--c:#16a34a;--bg:#e6f7ec"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 14.5-4.5-4.5 1.4-1.4 3.1 3.1 6.1-6.1 1.4 1.4L11 16.5z"/></svg></div>
          <div class="stat-meta">
            <span class="stat-label">连接状态</span>
            <span class="stat-value" id="stat-conn">未连接</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="--c:#8b5cf6;--bg:#f1ecfe"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v2h16V7H4zm0 4v6h16v-6H4z"/></svg></div>
          <div class="stat-meta">
            <span class="stat-label">端口映射</span>
            <span class="stat-value" id="stat-count">0</span>
            <span class="stat-sub" id="stat-count-sub">生效 0 · 未生效 0</span>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">
            <h2>端口映射</h2>
            <p>由本应用添加，可随时删除或重新启用</p>
          </div>
          <button id="btn-add" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
            <span>添加映射</span>
          </button>
        </div>

        <div id="mapping-area" class="mapping-area">
          <div class="loading">
            <span class="spinner"></span>
            <span>正在加载…</span>
          </div>
        </div>
      </section>

      <section class="panel panel-sub hidden" id="ext-panel">
        <div class="panel-head">
          <div class="panel-title">
            <h2>
              <span class="title-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v2h2V6H5zm-1 5h16a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm1 2v2h2v-2H6z"/></svg>
              </span>
              其他设备添加
              <span class="count-badge" id="ext-count">0</span>
            </h2>
            <p>路由器上已存在、由其他设备或程序创建的转发规则</p>
          </div>
          <span class="panel-note">非本应用托管</span>
        </div>

        <div id="external-area" class="mapping-area"></div>
      </section>
    </main>

    <footer class="foot">
      <span>本机局域网 IP：<b id="foot-lan">—</b></span>
      <span class="dot-sep">·</span>
      <span>映射数据仅保存在本机，用于路由器 UPnP 管理</span>
    </footer>
  </div>

  <!-- 添加映射弹窗 -->
  <div id="modal" class="modal-mask hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3>添加端口映射</h3>
        <button class="icon-btn" id="btn-modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="f-desc">描述</label>
          <input id="f-desc" type="text" placeholder="例如：NAS 管理面板" maxlength="128" />
        </div>

        <div class="field">
          <label>协议</label>
          <div class="seg" id="f-protocol">
            <button type="button" class="seg-item active" data-value="TCP">TCP</button>
            <button type="button" class="seg-item" data-value="UDP">UDP</button>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="f-ext">外部端口</label>
            <input id="f-ext" type="number" min="1" max="65535" placeholder="外部端口" />
          </div>
          <div class="field">
            <label for="f-int">内部端口</label>
            <input id="f-int" type="number" min="1" max="65535" placeholder="内部端口" />
          </div>
        </div>

        <div class="field">
          <label for="f-client">内部 IP <span class="hint">（默认本机）</span></label>
          <input id="f-client" type="text" placeholder="自动检测" />
        </div>

        <div class="field">
          <label for="f-lease">租期</label>
          <select id="f-lease">
            <option value="0" selected>永久</option>
            <option value="3600">1 小时</option>
            <option value="43200">12 小时</option>
            <option value="86400">24 小时</option>
            <option value="604800">7 天</option>
          </select>
        </div>

        <div id="modal-error" class="modal-error hidden"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="btn-modal-cancel">取消</button>
        <button class="btn btn-primary" id="btn-modal-submit">确认添加</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="static/js/app.js"></script>
</body>
</html>
